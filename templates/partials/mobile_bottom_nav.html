{% load roles %}

<nav class="mbn-nav" aria-label="Navigation mobile">

  <a class="mbn-item" href="{% url 'home' %}">
    <i class="fas fa-house"></i>
    <span>Accueil</span>
  </a>

  <a class="mbn-item" href="{% url 'fixtures' %}">
    <i class="fas fa-calendar-days"></i>
    <span>Calendrier</span>
  </a>

  <a class="mbn-item" href="{% url 'standings' %}">
    <i class="fas fa-ranking-star"></i>
    <span>Classement</span>
  </a>

  <a class="mbn-item" href="{% url 'results' %}">
    <i class="fas fa-list-check"></i>
    <span>Résultats</span>
  </a>

  {% if user.is_authenticated and user|has_role:"superadmin,organisateur,paiement,match" and not user.team %}
    <a class="mbn-item" href="{% url 'dashboard' %}">
      <i class="fas fa-shield-halved"></i>
      <span>Admin</span>
    </a>
  {% else %}
    <a class="mbn-item" href="{% url 'my_matches' %}">
      <i class="fas fa-futbol"></i>
      <span>Mes matchs</span>
    </a>
  {% endif %}

  {% if user.is_authenticated %}
    <a class="mbn-item" href="{% url 'logout' %}">
      <i class="fas fa-right-from-bracket"></i>
      <span>Quitter</span>
    </a>
  {% else %}
    <a class="mbn-item" href="{% url 'login' %}">
      <i class="fas fa-right-to-bracket"></i>
      <span>Connexion</span>
    </a>
  {% endif %}

</nav>

<style>
/* ============================================ */
/* MOBILE BOTTOM NAV */
/* ============================================ */
.mbn-nav {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 1030;
  display: flex;
  justify-content: space-around;
  gap: 2px;
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
  background: rgba(6, 10, 18, 0.96);
  border-top: 1px solid rgba(230, 194, 0, 0.18);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}

.mbn-item {
  flex: 1;
  text-align: center;
  color: rgba(255,255,255,.70);
  text-decoration: none;
  padding: 8px 2px;
  border-radius: 10px;
  font-weight: 700;
  font-size: 0.625rem;
  line-height: 1;
  transition: background .15s ease, color .15s ease;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.mbn-item i {
  font-size: 1rem;
  color: rgba(255,255,255,.80);
  transition: color .15s ease;
}

.mbn-item:hover {
  background: rgba(255,255,255,.06);
  color: #fff;
}
.mbn-item:hover i { color: #fff; }

/* Active state */
.mbn-item.active {
  background: rgba(230,194,0,.12);
  color: #e6c200;
}
.mbn-item.active i { color: #e6c200; }

/* ============================================ */
/* RESPONSIVE */
/* ============================================ */
@media (min-width: 992px) {
  .mbn-nav { display: none; }
}
@media (max-width: 991px) {
  body { padding-bottom: 82px; }
}
</style>
